<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnexGTech AI Assistant</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:700px;
    height:85vh;
    background:#1e293b;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#2563eb;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.chat{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    margin:10px 0;
    padding:12px;
    border-radius:12px;
    max-width:80%;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.bot{
    background:#334155;
}

.controls{
    padding:10px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
🤖 AnexGTech AI Assistant
</div>

<div class="chat" id="chat"></div>

<div class="controls">
<input id="message" placeholder="Type your message...">
<button onclick="sendMessage()">📤 Send</button>
<button onclick="startVoice()">🎤 Talk</button>
<button onclick="speechSynthesis.cancel()">⏹ Stop</button>
<button onclick="clearChat()">🗑 Clear</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");

function addMessage(text,type){

const div = document.createElement("div");

div.className = "message " + type;

div.innerText = text;

chat.appendChild(div);

chat.scrollTop = chat.scrollHeight;

}

async function sendMessage(){

const input = document.getElementById("message");

const userText = input.value.trim();

if(!userText) return;

addMessage(userText,"user");

input.value="";

const response = await fetch(
"https://n8n-gopal.server.anexgtech.com/webhook/test-agent",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:userText
})
}
);

const reply = await response.text();

addMessage(reply,"bot");

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(reply)
);

}

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

recognition.lang = "en-US";

function startVoice(){

recognition.start();

}

recognition.onresult = (event)=>{

const text =
event.results[0][0].transcript;

document.getElementById("message").value =
text;

sendMessage();

};

function clearChat(){

chat.innerHTML = "";

}

addMessage(
"Welcome to AnexGTech. How can I help you today?",
"bot"
);

</script>

</body>
</html>
